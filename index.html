<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NY Giants Fan Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>New York Giants</h1>
  <button id="mode-toggle">Toggle Dark/Light Mode</button>
</header>

<section id="about">
  <h2>About</h2>
  <p>The New York Giants are an NFL team in the NFC East.</p>
</section>

<section id="highlighted-player">
  <h2>Highlighted Player</h2>
  <article class="player">
    <img src="https://via.placeholder.com/150" alt="Jaxson Dart">
    <h3>Jaxson Dart</h3>
    <p>Quarterback</p>
  </article>
</section>

<section id="contact">
  <h2>Contact</h2>
  <form id="contact-form">
    <label for="name">Name:</label>
    <input type="text" id="name" required>
    <button type="submit">Submit</button>
  </form>
  <p id="form-response"></p>
</section>

<footer>
  <p>© 2026 Giants Fan Page</p>
</footer>

<script src="script.js"></script>
</body>
</html>
